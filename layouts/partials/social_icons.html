<div class="social-icons" {{ with .align}}align="{{.}}" {{- end }}>
    {{- range site.Params.socialIcons }}
    {{- $url := trim .url " " }}
    {{- $isMail := hasPrefix $url "mailto:" }}
    <a href="{{ $url | safeURL }}"
        {{- if $isMail }} class="email-trigger" data-email="{{ strings.TrimPrefix "mailto:" $url }}" rel="me"
        {{- else }} target="_blank" rel="noopener noreferrer me"
        {{- end }}
        title="{{ (.title | default .name) | title }}">
        {{ partial "svg.html" . }}
    </a>
    {{- end }}
</div>
